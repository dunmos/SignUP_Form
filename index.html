
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="/SignUP_Form/css/style.css">

    <!-- Connect to Google Fonts early -->
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Load the Roboto font -->
<link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
    rel="stylesheet"
>
</head>
<body>
    <!--main container -->
    <div class="container">

        <!-- Left sidebar -->
        <div class="sidebar">

            <div class="logo">
                <img src="/SignUP_Form/images/odin-lined.png" alt="Odin logo">
                <span>ODIN</span>
            </div>

            <p class="photo-credit">
                Photo by <a href="https://unsplash.com/photos/green-fern-plant-during-daytime-8KB21Ckcz2o">Artem Bryzgalov on Unsplash</a>
            </p>

        </div>

        <!-- Right section -->
        <div class="main-content">

            <div class="intro">
                <p>
                    This is not a real online service! You know you need
                    something <br>like this in your life to help you realize
                    your deepest dreams.<br> Sign up <em>now</em> to get started.
                </p>

                <p>You <em>know</em> you want to.</p>
            </div>

            <!-- Sign-up form -->
           <div class="form-section">
             <form action="#" method="get">
            <h2>Let's do this!</h2>
        
            <div class="form-container">
                <div class="form-column">
                    <div class="form-field">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" required >
                    </div>
        
                    <div class="form-field">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" required>
                    </div>
        
                    <div class="form-field">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" minlength="8" required>
                    </div>
                </div>
        
                <div class="form-column">
                    <div class="form-field">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" required>
                    </div>
        
                    <div class="form-field">
                        <label for="phone">PHONE NUMBER</label>
                        <input type="tel" id="phone">
                    </div>
        
                    <div class="form-field">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" minlength="8" required>
                    </div>
                </div>
            </div>
        </div>
    </form>
        

                <!-- Button and login link -->
                <div class="form-footer">
                    <button type="submit">Create Account</button>

                    <p>
                        Already have an account?
                        <a href="#">Log in</a>
                    </p>
                </div>

            

        </div>

    </div>
  

</body>
</html>
